services:
  db:
    image: postgres:16-alpine
    container_name: doc_ai_postgres
    restart: always
    environment:
      POSTGRES_DB: doc_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doc_ai_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: doc_ai_web
    restart: always
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 180 backend.wsgi:app
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-key-change-in-production-1234567890abcdef
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/doc_intelligence
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - AI_PROVIDER=fallback
    volumes:
      - app_storage:/app/storage
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: doc_ai_worker
    restart: always
    command: celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=4
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/doc_intelligence
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - AI_PROVIDER=fallback
    volumes:
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  app_storage:

