# ==============================================================================
# Render Blueprint - AI Document Intelligence (Free Tier Deployment)
# Deploy via Render Dashboard -> Blueprints -> New Blueprint Instance
# ==============================================================================

databases:
  - name: ai-doc-intelligence-db
    databaseName: doc_intelligence
    user: doc_admin
    plan: free

services:
  - type: web
    name: ai-document-intelligence
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 backend.wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-doc-intelligence-db
          property: connectionString
      - key: CELERY_ALWAYS_EAGER
        value: "True"
      - key: STORAGE_BACKEND
        value: local
      - key: AI_PROVIDER
        value: vision_gemini
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash-lite
      - key: CONFIDENCE_THRESHOLD
        value: "0.75"
      - key: GEMINI_API_KEY
        sync: false

